ces.zip">youth education, employment and training</a>, and <a href="/data/economy/trade-components-sources.zip">exports and imports</a>. Download the original files for <a href="/data/economy/merchandise-mix-sources.zip">merchandise composition</a> and <a href="/data/economy/commercial-mix-sources.zip">commercial services composition</a>. Download the source files for <a href="/data/economy/partner-regions-sources.zip">partner regions</a>, <a href="/data/economy/partner-groups-sources.zip">partner groups</a> and <a href="/data/economy/trade-indices-sources.zip">trade indices</a>. Download the original files for <a href="/data/economy/resource-rents-sources.zip">resource rents</a>, <a href="/data/economy/resource-depletion-sources.zip">resource depletion</a>, and <a href="/data/economy/land-shares-sources.zip">land use</a>. Download the <a href="/data/economy/freshwater-sources.zip">freshwater source files</a> and the <a href="/data/economy/electricity-sources.zip">Ember electricity source files</a>. Download the <a href="/data/economy/power-industry.csv.gz">annual demand and industrial output comparison</a> and <a href="/data/economy/industry-electricity-output.csv.gz">industrial electricity use and output</a>. Download the <a href="/data/economy/manufacturing-per-person.csv.gz">manufacturing and population data</a> or the <a href="/data/economy/manufacturing-employment.csv.gz">manufacturing output and employment data</a>. Download the <a href="/data/economy/manufacturing-composition.csv.gz">manufacturing industry shares</a>. Download the <a href="/data/economy/industry-employment.csv.gz">industry employment and value-added shares</a>.</noscript>
